[package]
name = "artemis-desktop"
version = "0.1.0"
description = "ARTEMIS Desktop Shell"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "^2.0.0", features = [] }

[dependencies]
tauri = { version = "^2.0.0", features = ["tray-icon"] }
tauri-plugin-shell = "^2.0.0"
tauri-plugin-single-instance = "^2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58.0", features = ["Win32_System_JobObjects", "Win32_Foundation", "Win32_System_Threading", "Win32_Security"] }
